<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#050811" stroke="url(#cyber-grad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Inner Tech Marks -->
  <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4,6" opacity="0.6"/>
  <!-- OKXX Text -->
  <text x="50" y="58" font-family="'Orbitron', 'Segoe UI', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" filter="url(#glow)" letter-spacing="1">OKXX</text>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#7000ff" stroke-width="1.5" stroke-dasharray="12,18" opacity="0.8"/>
  <circle cx="8" cy="26" r="3" fill="#00f0ff"/>
  <circle cx="92" cy="74" r="3" fill="#ff0055"/>
</svg>
